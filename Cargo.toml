[package]
name = "appimanager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
appimage-rs = { version = "0.1.0", features = ["xz", "zstd"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
gettext-rs = "0.8"
gio = "0.21"
glib = "0.21"
gtk4 = { version = "0.10", features = ["v4_10"] }
libadwaita = { version = "0.8", features = ["v1_7"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[patch.crates-io]
appimage-rs = { path = "vendor/appimage-rs" }
