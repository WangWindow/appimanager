name: Linux packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version for a manual build (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-26.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            dpkg-dev \
            gettext \
            libglib2.0-bin \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set package version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.arch }}"
          if [[ "$actual_arch" != "$expected_arch" ]]; then
            echo "Expected native $expected_arch runner, got $actual_arch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint
        env:
          APPIMANAGER_VERSION: ${{ steps.version.outputs.version }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test application
        env:
          APPIMANAGER_VERSION: ${{ steps.version.outputs.version }}
        run: cargo test --locked

      - name: Test vendored AppImage offset fix
        run: cargo test --manifest-path vendor/appimage-rs/Cargo.toml --locked

      - name: Build release binary
        env:
          APPIMANAGER_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked

      - name: Build deb package
        run: bash packaging/build-deb.sh "${{ steps.version.outputs.version }}" "${{ matrix.deb_arch }}" dist

      - name: Build Arch Linux package
        if: matrix.arch == 'x86_64'
        run: bash packaging/build-arch-package.sh "${{ steps.version.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: appimanager-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appimanager-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
